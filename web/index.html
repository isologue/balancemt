<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>
<script>
const state={accounts:[],platforms:null,history:[],alertSettings:null,setupRequired:false,authenticated:false,selectedId:null,loading:false,sortOrder:'asc',syncError:false,lastSyncedAt:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=(v,c='USD')=>`${c==='USD'?'$':c+' '}${Number(v||0).toFixed(2)}`;
const usageText=a=>{if(!a?.usage_ready)return '数据积累中';return Number(a.consumption||0)>1e-9?money(a.consumption,a.currency):'暂无消耗'};
const etaText=a=>{if(!a?.usage_ready)return '数据积累中';const consumption=Number(a.consumption||0),hours=Number(a.estimated_hours||0);if(consumption<=1e-9)return '暂无消耗';if(!Number.isFinite(hours)||hours<=0)return '不足 1 小时';return hours>24?`${(hours/24).toFixed(hours/24>=100?0:1)} 天`:`${hours.toFixed(hours<10?1:0)} 小时`};
const usageWindowText=a=>`近${Number(a?.usage_window_hours||24)}小时`;
const date=v=>v?new Date(v).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'尚未查询';
const providerLabel=p=>p==='sub2api'?'Sub2API':p==='new-api'?'New-API':'自定义兼容';
const initials=n=>String(n||'?').slice(0,1).toUpperCase();
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.add('hidden'),2600)}
async function api(path,opt={}){
  const res=await fetch(path,{...opt,credentials:'same-origin',cache:'no-store',signal:opt.signal||AbortSignal.timeout(15000),headers:{'Content-Type':'application/json',...(opt.headers||{})}});
  let data={};try{data=await res.json()}catch{}
  if(!res.ok){const error=new Error(data.error||'请求失败');error.status=res.status;throw error}
  return data;
}
let syncTimer=null;
let refreshInFlight=null;
let syncGeneration=0;
async function boot(){const status=await api('/api/auth/status');state.setupRequired=status.setup_required;state.authenticated=status.authenticated;if(state.authenticated){try{await refresh()}catch(err){if(err.status===401)state.authenticated=false;else state.syncError=true}}render()}
async function refresh(){
  if(refreshInFlight)return refreshInFlight;
  const generation=syncGeneration;
  refreshInFlight=(async()=>{
    const [accounts,settings,platforms]=await Promise.all([api('/api/accounts'),api('/api/settings/alerts'),state.platforms?Promise.resolve(state.platforms):api('/api/platforms')]);
    if(generation!==syncGeneration||!state.authenticated)return;
    state.accounts=accounts;state.alertSettings=settings;state.platforms=platforms;
    state.lastSyncedAt=new Date();state.syncError=false;
    if(!state.selectedId||!accounts.some(a=>a.id===state.selectedId))state.selectedId=accounts[0]?.id||null;
  })();
  try{await refreshInFlight}finally{refreshInFlight=null}
}
function stopSync(){clearTimeout(syncTimer);syncTimer=null}
function scheduleSync(delay){
  stopSync();
  if(!state.authenticated||document.hidden)return;
  const interval=Math.max(1000,Math.min(5000,Number(state.alertSettings?.monitor_interval_seconds||10)*1000));
  syncTimer=setTimeout(syncDashboard,delay??interval);
}
function updateSyncStatus(){
  const status=$('#sync-status');
  if(status){status.textContent=state.syncError?'同步中断，正在重试':`已同步 ${state.lastSyncedAt?.toLocaleTimeString('zh-CN',{hour12:false})||''}`;status.classList.toggle('sync-error',state.syncError)}
}
async function syncDashboard(){
  const generation=syncGeneration;
  try{
    const before=JSON.stringify([state.accounts,state.alertSettings]);
    await refresh();
    if(generation!==syncGeneration||!state.authenticated)return;
    if(before!==JSON.stringify([state.accounts,state.alertSettings]))renderDashboard();
    updateSyncStatus();
  }catch(err){
    if(generation!==syncGeneration||!state.authenticated)return;
    if(err.status===401){syncGeneration++;state.authenticated=false;closeModal();render();toast('登录已过期，请重新登录');return}
    state.syncError=true;updateSyncStatus();
  }finally{if(generation===syncGeneration)scheduleSync()}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSync();else scheduleSync(0)});

  $('#backup-file').onchange=async()=>{error.textContent='';result.textContent='';const file=$('#backup-file').files[0];if(!file)return;setBusy(true);try{await readFile(file)}catch(err){error.textContent=err.message}finally{setBusy(false)}};

  exportForm.onsubmit=async e=>{e.preventDefault();error.textContent='';result.textContent='';setBusy(true);try{const backup=await api('/api/settings/backup/export',{method:'POST',body:JSON.stringify({})});const blob=new Blob([JSON.stringify(backup)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`balancemt-${new Date().toISOString().replace(/[:.]/g,'-')}.balancemt.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);exportForm.reset();result.textContent='加密备份已生成，无需口令，请妥善保管文件。\n到服务器登录后，在这里选择「导入备份」即可恢复配置。'}catch(err){error.textContent=err.message}finally{setBusy(false)}};
  importForm.onsubmit=async e=>{e.preventDefault();error.textContent='';result.textContent='';const f=new FormData(importForm);const file=f.get('file');if(!file||!file.size){error.textContent='请选择备份文件';return}if(file.size>8*1024*1024){error.textContent='备份文件不能超过 8 MB';return}setBusy(true);try{const backup=await readFile(file);const out=await api('/api/settings/backup/import',{method:'POST',body:JSON.stringify({backup,mode:f.get('mode'),import_alerts:f.get('import_alerts')==='on'})});importForm.reset();result.textContent=`导入成功：新增 ${out.added} 个，覆盖 ${out.updated} 个，跳过 ${out.skipped} 个。\n${out.alerts_imported?'告警配置、检查间隔和统计窗口已生效。':'保留了当前告警配置、检查间隔和统计窗口。'}站点余额将在后台自动检查时更新。`;try{await refresh();render()}catch{result.textContent+='\n配置已保存，列表刷新失败，请手动刷新页面。'}result.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(err){error.textContent=err.message;error.scrollIntoView({block:'nearest',behavior:'smooth'})}finally{setBusy(false)}};
}

function settingsPayload(form){const f=new FormData(form);return {monitor_interval_seconds:Number(f.get('monitor_interval_seconds')||10),usage_window_hours:Number(f.get('usage_window_hours')||24),failure_alert_threshold:Number(f.get('failure_alert_threshold')||5),smtp_host:String(f.get('smtp_host')||''),smtp_port:Number(f.get('smtp_port')||587),smtp_username:String(f.get('smtp_username')||''),smtp_password:String(f.get('smtp_password')||''),smtp_from:String(f.get('smtp_from')||''),alert_email_to:String(f.get('alert_email_to')||''),sms_provider:String(f.get('sms_provider')||''),sms_to:String(f.get('sms_to')||''),sms_webhook_url:String(f.get('sms_webhook_url')||''),sms_webhook_token:String(f.get('sms_webhook_token')||''),twilio_account_sid:String(f.get('twilio_account_sid')||''),twilio_auth_token:String(f.get('twilio_auth_token')||''),twilio_from:String(f.get('twilio_from')||''),clear_smtp_password:f.get('clear_smtp_password')==='on',clear_sms_webhook_token:f.get('clear_sms_webhook_token')==='on',clear_twilio_auth_token:f.get('clear_twilio_auth_token')==='on'}}
function openAlertSettings(){const a=state.alertSettings||{};const value=(key,fallback='')=>esc(a[key]??fallback);modal(`<div class="modal-head"><div><h2>告警配置</h2><p>页面保存后立即生效，不需要修改 env 或重启容器。</p></div><button class="close" id="modal-close">×</button></div><form id="alert-settings-form"><div class="settings-section"><h3>检查频率</h3><div class="form-grid"><div class="field"><label>余额检查间隔（秒）</label><input name="monitor_interval_seconds" type="number" min="1" max="86400" value="${value('monitor_interval_seconds',10)}" required /><span class="help">默认 10 秒，修改后实时生效。</span></div><div class="field"><label>连续失败告警次数</label><input name="failure_alert_threshold" type="number" min="1" max="1000" value="${value('failure_alert_threshold',5)}" required /><span class="help">默认连续失败 5 次后提醒；成功一次会重置计数，同一轮连续失败只提醒一次。</span></div><div class="field full"><label>消耗统计窗口（小时）</label><input name="usage_window_hours" type="number" min="1" max="720" value="${value('usage_window_hours',24)}" required /><span class="help">默认统计近 24 小时，根据余额采样估算；充值与消费同时发生或检查中断时可能有偏差。</span></div></div></div><div class="settings-section"><h3>邮件告警（SMTP）</h3><div class="form-grid"><div class="field"><label>SMTP 主机</label><input name="smtp_host" value="${value('smtp_host')}" placeholder="smtp.qq.com" /></div><div class="field"><label>SMTP 端口</label><input name="smtp_port" type="number" min="1" max="65535" value="${value('smtp_port',587)}" /></div><div class="field"><label>SMTP 用户名</label><input name="smtp_username" value="${value('smtp_username')}" /></div><div class="field"><label>SMTP 密码 / 授权码</label><input name="smtp_password" type="password" autocomplete="new-password" placeholder="${a.smtp_password_configured?'已配置，留空保持不变':'填写 SMTP 密码或授权码'}" /></div><div class="field"><label>发件人</label><input name="smtp_from" type="email" value="${value('smtp_from')}" placeholder="alert@example.com" /></div><div class="field full"><label>接收邮箱</label><input name="alert_email_to" value="${value('alert_email_to')}" placeholder="me@example.com, other@example.com" /><span class="help">多个邮箱用逗号或分号分隔。</span></div><div class="field full"><label class="check-line"><input name="clear_smtp_password" type="checkbox" /> 清空已保存的 SMTP 密码</label></div></div></div><div class="settings-section"><h3>短信告警</h3><div class="form-grid"><div class="field"><label>短信方式</label><select name="sms_provider"><option value="" ${!a.sms_provider?'selected':''}>关闭</option><option value="twilio" ${a.sms_provider==='twilio'?'selected':''}>Twilio</option><option value="webhook" ${a.sms_provider==='webhook'?'selected':''}>Webhook</option></select></div><div class="field"><label>接收手机号</label><input name="sms_to" value="${value('sms_to')}" placeholder="+8613800000000" /></div><div class="field full"><label>Webhook 地址</label><input name="sms_webhook_url" type="url" value="${value('sms_webhook_url')}" placeholder="https://sms.example.com/send" /></div><div class="field"><label>Webhook Token</label><input name="sms_webhook_token" type="password" autocomplete="new-password" placeholder="${a.sms_webhook_token_configured?'已配置，留空保持不变':'可选'}" /></div><div class="field"><label>Webhook Token 清理</label><label class="check-line"><input name="clear_sms_webhook_token" type="checkbox" /> 清空</label></div><div class="field"><label>Twilio Account SID</label><input name="twilio_account_sid" value="${value('twilio_account_sid')}" /></div><div class="field"><label>Twilio Auth Token</label><input name="twilio_auth_token" type="password" autocomplete="new-password" placeholder="${a.twilio_auth_token_configured?'已配置，留空保持不变':'填写 Token'}" /></div><div class="field"><label>Twilio 发件号码</label><input name="twilio_from" value="${value('twilio_from')}" placeholder="+1..." /></div><div class="field full"><label class="check-line"><input name="clear_twilio_auth_token" type="checkbox" /> 清空已保存的 Twilio Auth Token</label></div></div></div><div class="error-text" id="alert-settings-error"></div><div class="modal-actions"><button type="button" class="btn light" id="modal-cancel">取消</button><button type="button" class="btn light" id="alert-test">测试告警</button><button class="btn" type="submit">保存配置</button></div></form>`);$('#modal-cancel').onclick=closeModal;const form=$('#alert-settings-form');const error=$('#alert-settings-error');$('#alert-test').onclick=async()=>{error.textContent='';try{await api('/api/settings/alerts/test',{method:'POST',body:JSON.stringify(settingsPayload(form))});toast('测试告警已发送')}catch(err){error.textContent=err.message}};form.onsubmit=async e=>{e.preventDefault();error.textContent='';try{state.alertSettings=await api('/api/settings/alerts',{method:'PUT',body:JSON.stringify(settingsPayload(form))});await refresh();closeModal();toast('告警配置已保存');render()}catch(err){error.textContent=err.message}}}
function openPasswordModal(){modal(`<div class="modal-head"><div><h2>修改登录密码</h2><p>验证原密码后设置新的控制台登录密码。</p></div><button class="close" id="modal-close">×</button></div><form id="password-form"><div class="form-grid"><div class="field full"><label>原密码</label><input name="current_password" type="password" autocomplete="current-password" required /></div><div class="field"><label>新密码</label><input name="new_password" type="password" autocomplete="new-password" minlength="6" required /><span class="help">至少 6 位。</span></div><div class="field"><label>确认新密码</label><input name="confirm_password" type="password" autocomplete="new-password" minlength="6" required /></div><div class="error-text full" id="password-error"></div></div><div class="modal-actions"><button type="button" class="btn light" id="modal-cancel">取消</button><button class="btn" type="submit">保存新密码</button></div></form>`);$('#modal-cancel').onclick=closeModal;$('#password-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const payload=Object.fromEntries(f.entries());const error=$('#password-error');error.textContent='';try{await api('/api/auth/change-password',{method:'POST',body:JSON.stringify(payload)});closeModal();toast('密码已修改')}catch(err){error.textContent=err.message}}}function openAccountModal(account=null){
  const editing=!!account;
  const baseProvider=account?.base_provider||(account?.provider==='sub2api'?'sub2api':'new-api');
  const template=state.platforms[baseProvider];
  const value=(key,fallback='')=>esc(account?.[key]??fallback);
  modal(`<div class="modal-head"><div><h2>${editing?'编辑账户':'添加账户'}</h2><p>选择基础平台，按需调整接口参数。</p></div><button class="close" id="modal-close">×</button></div>
  <form id="account-form" data-id="${editing?account.id:''}"><div class="form-grid">
    <div class="field"><label>显示名称</label><input name="name" value="${value('name')}" placeholder="例如 主站 / 备用站" required /></div>
    <div class="field"><label>平台类型</label><select name="base_provider" id="provider"><option value="new-api" ${baseProvider==='new-api'?'selected':''}>New-API</option><option value="sub2api" ${baseProvider==='sub2api'?'selected':''}>Sub2API</option></select><span class="help">切换平台会重置下方接口参数。</span></div>
    <div class="field full"><label>站点地址</label><input name="base_url" type="url" value="${value('base_url')}" placeholder="https://api.example.com" required /><span class="help">填写站点地址，接口路径在下方单独配置。</span></div>
    <div class="field"><label>登录账号</label><input name="identifier" value="${value('identifier')}" placeholder="用户名或邮箱" required /></div>
    <div class="field"><label>${editing?'新密码（可选）':'登录密码（可选）'}</label><input name="password" type="password" autocomplete="new-password" placeholder="${editing?'留空则保留原密码':'账号密码登录时填写'}" /></div>
    <div class="field full"><label>访问令牌（可选）</label><input name="access_token" type="password" autocomplete="off" placeholder="${editing?'留空则保留原令牌':'填写后优先使用令牌查询'}" /><span class="help">令牌会加密保存；填写访问令牌后将跳过账号密码登录。</span></div>
    <div class="field"><label>New-API 用户 ID（可选）</label><input name="api_user_id" value="${value('api_user_id')}" placeholder="例如 123" /><span class="help">部分 New-API 站点要求此数字 ID，会发送为 New-Api-User 请求头。</span></div>
    <div class="field"><label>币种</label><select name="currency"><option ${value('currency','USD')==='USD'?'selected':''}>USD</option><option ${value('currency')==='CNY'?'selected':''}>CNY</option><option ${value('currency')==='EUR'?'selected':''}>EUR</option></select></div>
    <div class="field"><label>低余额提醒阈值</label><input name="threshold" type="number" step="0.01" value="${value('threshold',5)}" min="0" /></div>
    <div id="custom-fields" class="field full"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><label>接口配置</label><button type="button" class="btn light" id="reset-interface">恢复默认接口</button></div><span class="help" id="interface-status" aria-live="polite"></span>
      <div class="form-grid">
        <div class="field"><label>登录路径</label><input name="login_path" value="${value('login_path',template.login_path)}" placeholder="以 / 开头" pattern="/.*" required /></div>
        <div class="field"><label>余额路径</label><input name="balance_path" value="${value('balance_path',template.balance_path)}" placeholder="以 / 开头" pattern="/.*" required /></div>
        <div class="field"><label>账号字段</label><input name="identifier_key" value="${value('identifier_key',template.identifier_key)}" required /></div>
        <div class="field"><label>Token 字段</label><input name="token_field" value="${value('token_field',template.token_field)}" required /></div>
        <div class="field"><label>余额字段</label><input name="balance_field" value="${value('balance_field',template.balance_field)}" required /></div>
        <div class="field"><label>余额除数</label><input name="balance_scale" type="number" step="any" value="${value('balance_scale',template.balance_scale)}" required /><span class="help">显示余额 = 接口返回值 ÷ 余额除数，必须大于 0。</span></div>
      </div>
    </div>
  </div><div class="modal-actions"><button type="button" class="btn light" id="modal-cancel">取消</button><button class="btn" type="submit">${editing?'保存修改并查询':'保存并查询'}</button></div></form>`);
  const form=$('#account-form');
  const fields=['login_path','balance_path','identifier_key','token_field','balance_field','balance_scale'];
  const updateStatus=()=>{
    const base=form.elements.base_provider.value;
    const defaults=state.platforms[base];
    const custom=fields.some(key=>key==='balance_scale'?Number(form.elements[key].value)!==defaults[key]:form.elements[key].value.trim()!==defaults[key]);
    form.dataset.provider=custom?'generic':base;
    $('#interface-status').textContent=custom?`自定义兼容 · 基于 ${providerLabel(base)}`:`${providerLabel(base)} 默认接口`;
    const scale=form.elements.balance_scale;
    scale.setCustomValidity(Number(scale.value)>0?'':'余额除数必须大于 0');
  };
  const resetInterface=()=>{
    const defaults=state.platforms[form.elements.base_provider.value];
    fields.forEach(key=>form.elements[key].value=defaults[key]);
    updateStatus();
  };
  fields.forEach(key=>form.elements[key].addEventListener('input',updateStatus));
  $('#provider').onchange=resetInterface;
  $('#reset-interface').onclick=resetInterface;
  $('#modal-cancel').onclick=closeModal;
  form.onsubmit=submitAccount;
  updateStatus();
}
async function submitAccount(e){e.preventDefault();const form=e.currentTarget;const f=new FormData(form);const payload=Object.fromEntries(f.entries());payload.provider=form.dataset.provider;payload.threshold=Number(payload.threshold||0);payload.balance_scale=Number(payload.balance_scale||0);const id=form.dataset.id;const path=id?`/api/accounts/${id}`:'/api/accounts';const method=id?'PUT':'POST';try{await api(path,{method,body:JSON.stringify(payload)});closeModal();await refresh();render();toast(id?'账户已更新，正在重新查询':'账户已添加，正在后台查询');if(id){try{await checkOne(Number(id))}catch{}}}catch(err){toast(err.message)}}async function openHistory(){
  modal(`<div class="modal-head"><div><h2>最近失败记录</h2><p>仅保留最近 20 条失败记录，点击展开完整报错。</p></div><button class="close" id="modal-close" aria-label="关闭">×</button></div><div class="history-toolbar"><span>清空仅删除失败历史，不影响账户状态</span><button class="btn danger" id="clear-history-btn" disabled>清空记录</button></div><div id="failure-history" class="failure-history" aria-busy="true"><div class="empty">正在加载失败记录…</div></div>`);
  const content=$('#failure-history');
  const clearButton=$('#clear-history-btn');
  clearButton.onclick=async()=>{
    clearButton.disabled=true;
    clearButton.textContent='正在清空…';
    try{
      await api('/api/history?status=error',{method:'DELETE'});
      if(!content.isConnected)return;
      state.history=[];
      content.innerHTML='<div class="empty">暂无失败记录。</div>';
      toast('失败记录已清空');
    }catch(err){if(content.isConnected){clearButton.disabled=false;toast(err.message)}}
    finally{if(clearButton.isConnected)clearButton.textContent='清空记录'}
  };
  try{
    const history=await api('/api/history?status=error');
    if(!content.isConnected)return;
    state.history=history;
    clearButton.disabled=history.length===0;
    content.innerHTML=history.length?history.map(h=>`<details class="failure-record"><summary><span class="failure-icon">!</span><span class="failure-info"><strong>${esc(h.name)}</strong><small>${date(h.checked_at)}</small><span class="failure-preview">${esc(h.error||'接口未提供错误详情')}</span></span><span class="failure-toggle"></span></summary><div class="failure-detail"><span>完整报错</span><pre>${esc(h.error||'接口未提供错误详情')}</pre></div></details>`).join(''):`<div class="empty">暂无失败记录。</div>`;
  }catch(err){if(content.isConnected)content.innerHTML=`<div class="error-text">${esc(err.message)}</div>`}
  finally{if(content.isConnected)content.setAttribute('aria-busy','false')}
}
function $$(s){return [...document.querySelectorAll(s)]}
boot().catch(err=>{console.error(err);toast(err.message)});
</script>
</body>
